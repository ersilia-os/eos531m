Identifier: eos531m
Slug: hlm-half-life
Status: Ready
Title: Human Liver Microsome Half-Life (PredHLM)
Description: Predicts metabolic half-life in human liver microsomes from a 
  SMILES, as log10 minutes and minutes, plus the spread of a five-model XGBoost 
  ensemble on RDKit 2D descriptors and an applicability-domain score against the
  training set. Trained on 11,790 compounds from in-house Korea Chemical Bank 
  assays and ChEMBL (test RMSE 0.507, R2 0.43). Phase I metabolism only, not 
  prospectively validated; a decision-support tool, not a replacement for the 
  assay.
